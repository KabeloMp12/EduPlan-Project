<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPlan Timetable Solutions | Enquiry</title>
  </head>
  <body>
    <header>
      <div class="logo">EduPlan Timetable Solutions</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="enquiry.html">Enquiry</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Service Enquiry</h1>
      <p>
        Submit your product or service enquiries below, or inquire about
        becoming a sponsor or volunteer.
      </p>
      <form>
        <div>
          <label for="enquiry-name">Name:</label>
          <input type="text" id="enquiry-name" name="name" />
        </div>
        <div>
          <label for="enquiry-type">Enquiry Type:</label>
          <select id="enquiry-type" name="enquiry-type">
            <option value="service">Service Information</option>
            <option value="sponsor">Sponsorship</option>
            <option value="volunteer">Volunteer</option>
          </select>
        </div>
        <div>
          <label for="enquiry-msg">Details:</label>
          <textarea id="enquiry-msg" name="message" rows="4"></textarea>
        </div>
        <button type="submit">Submit Enquiry</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 EduPlan Timetable Solutions. All rights reserved.</p>
    </footer>
  </body>
</html>
