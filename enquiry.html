<!doctype html>
<html lang="en">
  <head>
    <!-- Metadata configuration -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPlan Timetable Solutions | Enquiry</title>
    <!-- Linked stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header and Navigation Menu -->
    <header>
      <div class="nav-container">
        <a href="index.html" class="logo">Edu<span>Plan</span></a>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="enquiry.html" class="active">Enquiry</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content Area: Customer Enquiry Section -->
    <main>
      <div class="form-card">
        <h1>Service & Support Enquiry</h1>
        <p style="margin-bottom: 1.5rem">
          Submit your product enquiries below, or request information regarding
          sponsorship and volunteering opportunities.
        </p>

        <!-- User Input Enquiry Form -->
        <form>
          <!-- Visitor Name Field -->
          <div class="form-group">
            <label for="enquiry-name">Full Name:</label>
            <input type="text" id="enquiry-name" name="name" required />
          </div>

          <!-- Enquiry Category Selection -->
          <div class="form-group">
            <label for="enquiry-type">Enquiry Type:</label>
            <select id="enquiry-type" name="enquiry-type">
              <option value="service">Service Information</option>
              <option value="sponsor">Sponsorship Opportunity</option>
              <option value="volunteer">Volunteer Program</option>
            </select>
          </div>

          <!-- Detailed Message Box -->
          <div class="form-group">
            <label for="enquiry-msg">Message Details:</label>
            <textarea
              id="enquiry-msg"
              name="message"
              rows="4"
              required
            ></textarea>
          </div>

          <!-- Form Submission Action Button -->
          <button type="submit" class="btn" style="width: 100%">
            Submit Enquiry
          </button>
        </form>
      </div>
    </main>

    <!-- Footer Component -->
    <footer>
      <p>&copy; 2026 EduPlan Timetable Solutions. All rights reserved.</p>
    </footer>
  </body>
</html>
